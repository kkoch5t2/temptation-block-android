name: Android logic tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  logic-tests:
    name: Run Android logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run test suite with JDK 17
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash scripts/dev.sh test-android
